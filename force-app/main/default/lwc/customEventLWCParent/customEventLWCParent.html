<template>
    <lightning-card title="Child to Parent Communication using Custom Event">
        <div class="slds-var-m-around_medium">
            <p class="slds-text-align_center">
                Counter: <lightning-formatted-number value={count}></lightning-formatted-number>
            </p>
            <lightning-progress-bar value={progressValue} size="large"></lightning-progress-bar>
        </div>
    </lightning-card>
    <c-custom-event-l-w-c-child
    onaddition={handleAdditionParent}
    onsubtraction={handleSubtractionParent}
    onprogressbar={handleProgressBar}>
    </c-custom-event-l-w-c-child>
</template>
